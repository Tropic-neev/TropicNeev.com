<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>404 | Tropic NEEV</title>
  <meta name="description" content="The page you're looking for could not be found. Return to Tropic NEEV — Fashion for Everyone.">
  <meta name="robots" content="noindex, follow">

  <link rel="icon" type="image/jpeg" href="logo.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --green: #0F2B22;
      --dark: #081813;
      --cream: #F2E9D8;
      --orange: #E8703A;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: var(--dark);
      color: var(--cream);
      font-family: "Inter", sans-serif;
      display: flex;
      flex-direction: column;
    }

    header {
      width: 100%;
      background: rgba(242, 233, 216, 0.97);
      color: var(--green);
      border-bottom: 1px solid rgba(15, 43, 34, 0.12);
    }

    .nav {
      max-width: 1200px;
      min-height: 76px;
      margin: 0 auto;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      text-decoration: none;
      color: var(--green);
      font-family: "Fraunces", serif;
      font-size: 24px;
      font-weight: 600;
    }

    .brand img {
      width: 42px;
      height: 42px;
      object-fit: cover;
      border-radius: 50%;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    nav a {
      color: var(--green);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: opacity 0.2s ease;
    }

    nav a:hover {
      opacity: 0.65;
    }

    .shop-link {
      background: var(--green);
      color: var(--cream) !important;
      padding: 11px 17px;
      border-radius: 999px;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 70px 22px 80px;
      position: relative;
      overflow: hidden;
    }

    .glow {
      position: absolute;
      width: 360px;
      height: 360px;
      border-radius: 50%;
      background: var(--orange);
      opacity: 0.08;
      filter: blur(70px);
      pointer-events: none;
    }

    .error-box {
      position: relative;
      width: min(680px, 100%);
      text-align: center;
    }

    .error-number {
      font-family: "Fraunces", serif;
      font-size: clamp(110px, 25vw, 210px);
      line-height: 0.8;
      letter-spacing: -0.07em;
      color: var(--cream);
      font-weight: 600;
    }

    .error-number span {
      color: var(--orange);
    }

    h1 {
      margin-top: 34px;
      font-family: "Fraunces", serif;
      font-size: clamp(30px, 6vw, 48px);
      line-height: 1.05;
      color: var(--cream);
    }

    .message {
      max-width: 500px;
      margin: 18px auto 0;
      color: rgba(242, 233, 216, 0.72);
      font-size: 15px;
      line-height: 1.7;
    }

    .actions {
      margin-top: 32px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 46px;
      padding: 0 21px;
      border-radius: 999px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .primary {
      background: var(--orange);
      color: #fff;
    }

    .secondary {
      border: 1px solid rgba(242, 233, 216, 0.3);
      color: var(--cream);
    }

    footer {
      text-align: center;
      padding: 25px 20px 30px;
      color: rgba(242, 233, 216, 0.58);
      font-size: 13px;
      border-top: 1px solid rgba(242, 233, 216, 0.09);
    }

    footer a {
      color: var(--cream);
      text-decoration: none;
    }

    @media (max-width: 650px) {
      .nav {
        min-height: 68px;
        padding: 10px 16px;
      }

      .brand {
        font-size: 21px;
      }

      .brand img {
        width: 38px;
        height: 38px;
      }

      nav {
        gap: 12px;
      }

      nav a:not(.shop-link) {
        display: none;
      }

      .shop-link {
        padding: 9px 14px;
        font-size: 13px;
      }

      main {
        padding: 55px 18px 65px;
      }

      .error-number {
        font-size: 130px;
      }

      h1 {
        margin-top: 27px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="nav">
      <a class="brand" href="home.html" aria-label="Tropic NEEV Home">
        <img src="logo.jpg" alt="Tropic NEEV logo">
        <span>Tropic.</span>
      </a>

      <nav>
        <a href="home.html">Home</a>
        <a href="home.html#fashion">Fashion</a>
        <a href="home.html#about">About</a>
        <a class="shop-link" href="home.html">Shop Now</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="glow"></div>

    <section class="error-box" aria-labelledby="error-title">
      <div class="error-number" aria-hidden="true">4<span>0</span>4</div>

      <h1 id="error-title">Looks like this page wandered off.</h1>

      <p class="message">
        The page you're looking for isn't here. Let's get you back to
        Tropic NEEV and discover your next fashion pick.
      </p>

      <div class="actions">
        <a class="button primary" href="home.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M3 10.5L12 3L21 10.5V21H14.5V14.5H9.5V21H3V10.5Z"
                  stroke="currentColor" stroke-width="1.8"
                  stroke-linejoin="round"/>
          </svg>
          Back to Home
        </a>

        <a class="button secondary"
           href="https://www.instagram.com/tropic.neev?stkn=MnV6bmNvdXN3eXU="
           target="_blank" rel="noopener noreferrer">
          Instagram
        </a>
      </div>
    </section>
  </main>

  <footer>
    <div>Tropic NEEV · Fashion for Everyone</div>
    <div style="margin-top:8px;">
      <a href="mailto:tropic.neev@gmail.com">tropic.neev@gmail.com</a>
    </div>
  </footer>

</body>
</html>
